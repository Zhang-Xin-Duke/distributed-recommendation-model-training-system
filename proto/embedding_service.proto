syntax = "proto3";

package eps.v1;
option cc_generic_services = true;

// Original transport contract; BRPC attachments contain the bulk arrays.
// Offsets are byte offsets within this RPC's request/response attachment.
enum ElementType {
  ELEMENT_UNSPECIFIED = 0;
  ELEMENT_FLOAT32 = 1;
  ELEMENT_UINT64 = 2;
}

message PayloadSlice {
  uint64 byte_offset = 1;
  uint64 byte_length = 2;
  uint64 element_count = 3;
  ElementType element_type = 4;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  LOOKUP = 1;
  PUSH = 2;
  RELEASE = 3;
  MAINTENANCE = 4;
}

message RequestIdentity {
  string run = 1;
  uint32 learner = 2;
  uint64 sequence = 3;
  Phase phase = 4;
}

message Status {
  enum Code {
    OK = 0;
    INVALID_ARGUMENT = 1;
    UNAVAILABLE = 2;
    STALE_GENERATION = 3;
    RETIRED_REQUEST = 4;
    CAPACITY_EXCEEDED = 5;
    RUN_FAILED = 6;
  }
  Code code = 1;
  string message = 2;
}

message WeightBounds {
  float minimum = 1;
  float maximum = 2;
}

message OptimizerConfig {
  float learning_rate = 1;
  float beta1 = 2;
  float beta2 = 3;
  float epsilon = 4;
  float initial_beta1_power = 5;
  float initial_beta2_power = 6;
  WeightBounds weight_bounds = 7;
}

message TableDefinition {
  uint32 table_id = 1;
  uint32 dimension = 2;
  uint32 shard_count = 3;
  uint64 partition_epoch = 4;
  OptimizerConfig optimizer = 5;
  float initialization_min = 6;
  float initialization_max = 7;
  uint64 initialization_seed = 8;
}

enum Pooling {
  POOLING_UNSPECIFIED = 0;
  SUM = 1;
  MEAN = 2;
  SEQUENCE = 3;
}

message FeatureInput {
  uint32 table_id = 1;
  uint32 feature_id = 2;
  Pooling pooling = 3;
  PayloadSlice keys = 4;
  PayloadSlice offsets = 5;
  PayloadSlice original_valid_lengths = 6;
}

message TensorBlock {
  uint32 feature_id = 1;
  repeated uint64 shape = 2;
  PayloadSlice values = 3;
}

enum Placement {
  PLACEMENT_UNSPECIFIED = 0;
  CPU = 1;
  LOADING = 2;
  GPU = 3;
  DRAINING = 4;
}

message LocatedRow {
  uint32 table_id = 1;
  uint64 key = 2;
  uint32 home_shard = 3;
  Placement placement = 4;
  uint32 agent_id = 5;
  uint64 generation = 6;
  uint64 slot = 7;
}

message AgentWork {
  enum Route {
    ROUTE_UNSPECIFIED = 0;
    CPU_POOL = 1;
    TRANSFER_UNIQUE = 2;
    RESIDENT_GPU = 3;
  }
  uint32 feature_id = 1;
  Route route = 2;
  uint32 agent_id = 3;
  repeated LocatedRow rows = 4;
  PayloadSlice occurrence_to_unique = 5;
  PayloadSlice transferred_weights = 6;
}

message CreateTableRequest { TableDefinition table = 1; }
message Ack { Status status = 1; }

// Task progress is separate from parameter ownership and optimizer versions.
message TrainingTask {
  string run = 1;
  uint64 epoch = 2;
  uint32 worker = 3;
  uint64 iteration = 4;
}
message TrainingControl { string run = 1; uint64 epoch = 2; string reason = 3; }
message TrainingPermitReply {
  Status status = 1;
  TrainingTask task = 2;
  uint64 observed_completion_floor = 3;
}
message TrainingStatsReply {
  Status status = 1;
  repeated uint64 completed = 2;
  uint64 completion_floor = 3;
  uint64 granted_tasks = 4;
  uint64 completed_tasks = 5;
  uint64 duplicate_completions = 6;
  uint32 active = 7;
  uint32 waiting = 8;
  bool paused = 9;
  bool failed = 10;
}
message TrainingCheckpointReply {
  Status status = 1;
  string source_run = 2;
  uint64 epoch = 3;
  // 0: sequential; 1: eventual; 2: bounded delay.
  uint32 consistency = 4;
  uint64 max_delay = 5;
  repeated uint64 completed = 6;
}
service TrainingService {
  rpc Begin(TrainingTask) returns (TrainingPermitReply);
  rpc Complete(TrainingTask) returns (Ack);
  rpc Stats(TrainingControl) returns (TrainingStatsReply);
  rpc Pause(TrainingControl) returns (Ack);
  rpc Checkpoint(TrainingControl) returns (TrainingCheckpointReply);
  rpc Resume(TrainingControl) returns (Ack);
  rpc Abort(TrainingControl) returns (Ack);
}

message GradientTable {
  uint32 table_id = 1;
  uint32 dimension = 2;
  PayloadSlice keys = 3;
  PayloadSlice values = 4;
}
message GradientContribution {
  TrainingTask task = 1;
  uint64 sample_count = 2;
  repeated GradientTable tables = 3;
}
message SynchronousGradientStatsReply {
  Status status = 1;
  uint64 next_round = 2;
  uint32 received_workers = 3;
  uint64 retained_bytes = 4;
  uint64 duplicate_submissions = 5;
  bool applying = 6;
  bool failed = 7;
  bool paused = 8;
}
message SynchronousTableSchema { uint32 table_id = 1; uint32 dimension = 2; }
message SynchronousGradientCheckpointReply {
  Status status = 1;
  string source_run = 2;
  uint64 epoch = 3;
  uint32 workers = 4;
  uint32 shard = 5;
  uint32 shards = 6;
  repeated SynchronousTableSchema tables = 7;
  uint32 reduction = 8;
  uint64 next_round = 9;
}
service SynchronousGradientService {
  rpc Submit(GradientContribution) returns (Ack);
  rpc Stats(TrainingControl) returns (SynchronousGradientStatsReply);
  rpc Abort(TrainingControl) returns (Ack);
  rpc Pause(TrainingControl) returns (Ack);
  rpc Resume(TrainingControl) returns (Ack);
  rpc Checkpoint(TrainingControl) returns (SynchronousGradientCheckpointReply);
}

message LookupRequest {
  RequestIdentity identity = 1;
  uint64 partition_epoch = 2;
  bool read_only = 3;
  repeated FeatureInput features = 4;
}

message LookupReply {
  Status status = 1;
  string ticket = 2;
  repeated TensorBlock cpu_contributions = 3;
  repeated AgentWork agent_work = 4;
}

message PushRequest {
  RequestIdentity identity = 1;
  string ticket = 2;
  repeated TensorBlock feature_gradients = 3;
}

message ReleaseRequest {
  RequestIdentity identity = 1;
  string ticket = 2;
}

message RowState {
  LocatedRow row = 1;
  PayloadSlice weights = 2;
  PayloadSlice first_moment = 3;
  PayloadSlice second_moment = 4;
  uint64 row_updates = 5;
}

message ReadStateRequest { repeated LocatedRow rows = 1; }
message ReadStateReply {
  Status status = 1;
  repeated RowState states = 2;
}

message MigrationCompletion {
  string plan_id = 1;
  repeated LocatedRow rows = 2;
  bool completed = 3;
}

message DrainRequest { string snapshot_id = 1; }
message OptimizerContext {
  uint32 table_id = 1;
  uint64 optimizer_sequence = 2;
  float learning_rate = 3;
  float beta1_power = 4;
  float beta2_power = 5;
}
message SnapshotReply {
  Status status = 1;
  string snapshot_id = 2;
  uint32 shard_id = 3;
  uint64 partition_epoch = 4;
  repeated string state_files = 5;
  repeated OptimizerContext optimizer_contexts = 6;
}

service EmbeddingService {
  rpc Stats(StatsRequest) returns (StatsReply);
  rpc RestoredFrom(StatsRequest) returns (RestoredSnapshotReply);
  rpc CreateTable(CreateTableRequest) returns (Ack);
  rpc Lookup(LookupRequest) returns (LookupReply);
  rpc Push(PushRequest) returns (Ack);
  rpc Release(ReleaseRequest) returns (Ack);
  rpc ReadState(ReadStateRequest) returns (ReadStateReply);
  rpc CompleteMigration(MigrationCompletion) returns (Ack);
  rpc DrainAndFlush(DrainRequest) returns (SnapshotReply);
  rpc ReadCheckpoint(SnapshotReadRequest) returns (SnapshotChunkReply);
  rpc ResumeCheckpoint(CheckpointIdentity) returns (Ack);
  rpc Locations(RowsRequest) returns (LocationsReply);
  rpc MoveRows(MoveRequest) returns (LocationsReply);
}

message CheckpointIdentity {
  string run = 1;
  uint64 partition_epoch = 2;
  string snapshot_id = 3;
}
message RestoredSnapshotReply {
  Status status = 1;
  bool loaded = 2;
  bool pristine = 3;
  string run = 4;
  string source_run = 5;
  uint64 file_bytes = 6;
  uint64 checksum = 7;
  uint32 shard = 8;
  uint32 shard_count = 9;
  uint64 partition_epoch = 10;
}
message SnapshotReadRequest {
  CheckpointIdentity identity = 1;
  uint64 offset = 2;
  uint32 max_bytes = 3;
}
message SnapshotChunkReply {
  Status status = 1;
  uint64 offset = 2;
  uint64 total_bytes = 3;
  bytes data = 4;
  bool eof = 5;
}

message StatsRequest {}
message StatsReply {
  Status status = 1;
  uint64 lookups = 2; uint64 updates = 3; uint64 duplicate_requests = 4;
  uint64 rows = 5; uint64 state_bytes = 6; uint64 live_tickets = 7;
  uint64 ticket_payload_bytes = 8; uint64 queued_payload_bytes = 9;
  uint64 cached_rows = 10; uint64 migration_bytes = 11;
  uint64 executed_operations = 12; uint64 queue_wait_nanoseconds = 13;
  uint64 executor_busy_nanoseconds = 14; uint64 rejected_operations = 15;
  uint64 peak_queued_operations = 16;
  uint64 expanded_gradient_bytes = 17; uint64 transferred_gradient_bytes = 18;
  uint64 compact_update_commands = 19;
  uint64 policy_windows = 20; uint64 policy_tracked_rows = 21;
  uint64 policy_admitted_rows = 22; uint64 policy_evicted_rows = 23;
  uint64 policy_pinned_skips = 24; uint64 policy_budget_skips = 25;
  uint64 policy_migration_batches = 26; uint64 policy_migration_bytes = 27;
  uint64 policy_failures = 28;
  uint64 lookup_prepare_nanoseconds = 29;
  uint64 gradient_prepare_nanoseconds = 30;
  uint64 gpu_packet_prepare_nanoseconds = 31;
  uint64 update_dispatch_nanoseconds = 32;
  uint64 cpu_optimizer_nanoseconds = 33;
  uint64 agent_wait_nanoseconds = 34;
  uint64 migration_nanoseconds = 35;
  uint64 cache_maintenance_nanoseconds = 36;
  uint64 active_operations = 37;
  uint64 waiting_operations = 38;
  uint64 active_payload_bytes = 39;
  uint64 dependency_payload_bytes = 40;
  uint64 dependency_prepare_nanoseconds = 41;
  uint64 dependency_rebuilds = 42;
  uint64 dependency_cache_hits = 43;
  uint64 queued_observations = 44;
  uint64 completed_observations = 45;
  uint64 rejected_observations = 46;
  uint64 dependency_budget_waits = 47;
}

message RowKey { uint32 table_id = 1; uint64 key = 2; }
message RowsRequest { repeated RowKey rows = 1; }
message LocationsReply { Status status = 1; repeated LocatedRow rows = 2; }
message MoveRequest {
  string run = 1;
  repeated RowKey rows = 2;
  uint32 agent_id = 3;
  Placement destination = 4;
  uint64 network_bytes = 5;
  uint64 staging_bytes = 6;
  uint32 max_inflight_batches = 7;
  uint64 reserve_slots = 8;
}

message AgentIdentity { string run = 1; uint32 home_shard = 2; uint64 sequence = 3; }
message AgentDefineRequest { AgentIdentity identity = 1; TableDefinition table = 2; }
message AgentCapacityRequest { string run = 1; uint32 table_id = 2; }
message AgentCapacityReply { Status status = 1; uint64 free_slots = 2; }
message MigrationPlan {
  string id = 1; uint32 agent_id = 2; repeated LocatedRow rows = 3;
  Placement destination = 4; uint64 estimated_bytes = 5;
  uint64 reserve_slots = 6;
}
message AgentLoadRequest {
  AgentIdentity identity = 1; MigrationPlan plan = 2; repeated RowState states = 3;
}
message AgentGatherRequest {
  string run = 1; repeated AgentWork work = 2; repeated FeatureInput layouts = 3;
}
message AgentGatherReply { Status status = 1; repeated TensorBlock contributions = 2; }
message UpdateContext {
  RequestIdentity original_request = 1; uint32 home_shard = 2; uint32 table_id = 3;
  uint64 optimizer_sequence = 4; float learning_rate = 5;
  float beta1_power = 6; float beta2_power = 7;
}
message AgentApplyRequest {
  AgentIdentity identity = 1; UpdateContext context = 2;
  repeated RowKey rows = 3; PayloadSlice gradients = 4;
}
message AgentPlanRequest { AgentIdentity identity = 1; MigrationPlan plan = 2; }
message AgentCompactApplyRequest {
  AgentIdentity identity = 1; UpdateContext context = 2; uint32 dimension = 3;
  repeated RowKey rows = 4; PayloadSlice source_values = 5;
  PayloadSlice row_offsets = 6; PayloadSlice source_rows = 7; PayloadSlice scales = 8;
}
message AgentAdmissionStatsReply {
  Status status = 1;
  uint64 active_operations = 2;
  uint64 queued_operations = 3;
  uint64 pending_request_bytes = 4;
  uint64 peak_active_operations = 5;
  uint64 peak_pending_operations = 6;
  uint64 peak_request_bytes = 7;
  uint64 accepted_requests = 8;
  uint64 completed_requests = 9;
  uint64 rejected_requests = 10;
  uint64 queue_wait_nanoseconds = 11;
  uint64 dispatch_failures = 12;
  uint64 active_limit = 13;
  uint64 pending_limit = 14;
  uint64 request_bytes_limit = 15;
}
service CacheAgentService {
  rpc AdmissionStats(StatsRequest) returns (AgentAdmissionStatsReply);
  rpc Define(AgentDefineRequest) returns (Ack);
  rpc FreeSlots(AgentCapacityRequest) returns (AgentCapacityReply);
  rpc Load(AgentLoadRequest) returns (LocationsReply);
  rpc Gather(AgentGatherRequest) returns (AgentGatherReply);
  rpc Apply(AgentApplyRequest) returns (Ack);
  rpc ApplyCompact(AgentCompactApplyRequest) returns (Ack);
  rpc ReadBack(AgentPlanRequest) returns (ReadStateReply);
  rpc CommitEviction(AgentPlanRequest) returns (Ack);
}
